services:
  postgres:
    image: postgres:16-alpine
    container_name: soouq_merchant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: merchant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-merchant}
      POSTGRES_DB: merchant_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchant -d merchant_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: soouq_merchant_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soouq_merchant_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://merchant:${POSTGRES_PASSWORD:-merchant}@postgres:5432/merchant_db
      DATABASE_URL_SYNC: postgresql+psycopg2://merchant:${POSTGRES_PASSWORD:-merchant}@postgres:5432/merchant_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      FRONTEND_URL: ${FRONTEND_URL:-http://187.77.172.90:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://187.77.172.90:3000,http://187.77.172.90:8000}
    ports:
      - "8000:8000"
    volumes:
      - export_storage:/app/storage/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soouq_merchant_celery
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://merchant:${POSTGRES_PASSWORD:-merchant}@postgres:5432/merchant_db
      DATABASE_URL_SYNC: postgresql+psycopg2://merchant:${POSTGRES_PASSWORD:-merchant}@postgres:5432/merchant_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --loglevel=info
      -Q discovery,enrichment,scoring,default,outreach
      --pool=solo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://187.77.172.90:8000/api/v1}
    container_name: soouq_merchant_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  export_storage:
